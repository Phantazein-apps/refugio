<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- REFUGIO — the Enclosure mark, from the Phantazein identity.

       Three walls open at the bottom: a refuge you can walk into and out of,
       not a locked box. The red inside is what it holds.

       Square and hard-edged, matching the rest of the identity. The mark it
       replaces was a rounded-rect mountain scene with a lit hut — legible at
       512px, an indistinct grey smudge at the 16px a browser tab actually
       renders, and reading as an outdoors app at every size in between. -->
  <rect width="512" height="512" fill="#000000"/>
  <path d="M196 424 L120 424 L120 120 L392 120 L392 424 L316 424"
        fill="none" stroke="#f4f2ee" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#ff0018" stroke-width="32" stroke-linecap="round">
    <line x1="176" y1="192" x2="236" y2="252"/>
    <line x1="336" y1="192" x2="276" y2="252"/>
    <line x1="176" y1="352" x2="236" y2="292"/>
    <line x1="336" y1="352" x2="276" y2="292"/>
    <line x1="256" y1="176" x2="256" y2="214"/>
    <line x1="256" y1="368" x2="256" y2="330"/>
    <line x1="160" y1="272" x2="198" y2="272"/>
    <line x1="352" y1="272" x2="314" y2="272"/>
  </g>
</svg>
