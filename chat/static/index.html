<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REFUGIO</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico">
<!-- Before the stylesheets, deliberately. Deciding the theme after first paint
     means a frame of black on a light Mac, which is not a subtlety when the
     two palettes are this far apart. Kept inline and duplicated in
     settings.html rather than in theme.js, because a <script src> in <head> —
     even a blocking one — is a round trip this can't afford. -->
<script>
  (function () {
    try {
      var p = localStorage.getItem("refugio.theme");
      if (p !== "light" && p !== "dark") {
        p = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = p;
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
    // In the native window, reserve the top 38px: macOS draws the traffic
    // lights there, and an AppKit strip sits over it so the window can be
    // dragged by its top bar. In a browser neither exists and the space would
    // be dead margin, so this is a class rather than a constant.
    if (navigator.userAgent.indexOf("REFUGIO-Native") !== -1) {
      document.documentElement.classList.add("native");
    }
  })();
</script>
<link rel="stylesheet" href="phantazein.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Empty on purpose. It is under the AppKit drag strip, so anything here
     would be unclickable; it exists to keep the rail head and the top bar out
     from under the traffic lights. -->
<div class="titlebar" aria-hidden="true"></div>
<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <span class="brand">REFUGIO<span class="dot">.</span></span>
      <span class="beta" title="REFUGIO v2 is in beta — expect rough edges, and please report them">beta</span>
      <button class="rail-toggle" id="rail-toggle" type="button"
              title="Collapse history" aria-label="Collapse history">«</button>
    </div>
    <button class="new-chat" id="new-chat"><span class="nc-full">+ New chat</span><span class="nc-mini">+</span></button>
    <div class="convos" id="convos"></div>
  </aside>

  <main class="main">
    <!-- Also the window's drag handle in the native app: the title bar there is
         transparent and the web view runs under it, so this strip is where a
         person instinctively grabs the window. -->
    <div class="topbar">
      <!-- A button and a panel, not a <select>. A native select cannot show
           what a model costs against the memory free right now, which is the
           only thing that makes the choice decidable. -->
      <button class="model-btn" id="model-btn" type="button" aria-haspopup="dialog" aria-expanded="false">
        <span class="dot" id="model-dot"></span>
        <span class="mb-name" id="model-name">…</span>
        <span class="mb-size" id="model-size"></span>
        <span class="mb-caret" aria-hidden="true">▾</span>
      </button>
      <div class="model-panel" id="model-panel" role="dialog" aria-label="Choose a model" hidden></div>
      <div class="status" id="status" role="button" tabindex="0"><span class="led"></span><span id="status-text">checking…</span></div>
      <!-- Light/dark, one click. The three-way control including "follow the
           system" lives in Settings — this is the switch you reach for when
           the room changes, not when your preferences do. -->
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch theme">
        <svg class="t-sun" width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.4v2.4M12 19.2v2.4M2.4 12h2.4M19.2 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"/>
        </svg>
        <svg class="t-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/>
        </svg>
      </button>
      <a class="settings-link" href="/settings" title="Settings">Settings</a>
    </div>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread">
        <div class="empty" id="empty">
          <h1>Your AI, on your machine</h1>
          <div class="sub">Nothing leaves this computer. Ask anything to begin.</div>
          <div class="sub beta-note">
            This is the <strong>v2 beta</strong> — REFUGIO's own chat window, replacing Open WebUI.
            Expect rough edges, and please
            <a href="https://github.com/Phantazein-apps/refugio/issues" target="_blank" rel="noopener noreferrer">report them</a>.
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <!-- Shown only while web search is armed, and only for the next message. -->
      <div class="web-warn" id="web-warn" hidden></div>
      <div class="composer-inner">
        <button class="web-arm" id="web-arm" type="button" hidden aria-pressed="false">
          <span aria-hidden="true">🌐</span> Web
        </button>
        <textarea id="input" rows="1" placeholder="Message REFUGIO…" autofocus></textarea>
        <button class="send" id="send" title="Send" disabled>↑</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </main>

  <!-- Sources: what the answer was built from. Collapsed to a rail tab until
       there is something in it. -->
  <aside class="gutter is-collapsed" id="gutter" hidden>
    <button class="gutter-rail" id="gutter-rail" type="button" title="Show sources">
      <span class="gr-count" id="gutter-count">0</span>
      <span class="gr-label">Sources</span>
    </button>
    <div class="gutter-panel">
      <div class="gutter-head">
        <strong>Sources</strong>
        <button class="gutter-x" id="gutter-x" type="button" title="Hide sources">&times;</button>
      </div>
      <div class="gutter-body" id="gutter-body"></div>
    </div>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
