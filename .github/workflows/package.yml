# Build the .pkg and .msi.
#
# Runs on every push so the packaging scripts cannot rot unnoticed — the whole
# reason CI exists in this repo is that a Swift change shipped three times
# without ever being compiled. Packaging has the same failure mode and a worse
# blast radius: a broken .pkg is discovered by an IT department mid-rollout.
#
# Signing is CONDITIONAL, on purpose. Without secrets the jobs still run and
# produce unsigned artifacts clearly labelled as such, so a fork, a PR from
# outside, and a repo whose owner has not bought certificates yet all still get
# the build checked. With secrets present the same scripts sign and notarize.
#
# What the secrets are, and what they cost, is in packaging/README.md.

name: Package

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: .pkg
    runs-on: macos-latest
    # The `secrets` context is NOT available in a step-level `if` — only
    # `env` is. So the presence of each secret is resolved once here, where
    # secrets ARE allowed, and the steps below branch on env instead.
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' && 'yes' || 'no' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY != '' && 'yes' || 'no' }}
      HAS_INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_IDENTITY != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Import the two certificates into a throwaway keychain. A throwaway one
      # rather than the login keychain: the runner is shared-tenant, and the
      # keychain is deleted in `always()` below so a cancelled run cannot leave
      # a signing identity behind on it.
      - name: Import signing certificates
        if: env.HAS_CERT == 'yes'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/certs.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certs.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          # Without this, codesign blocks on a GUI prompt that no one will ever
          # click and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm -f /tmp/certs.p12
          security find-identity -v -p codesigning build.keychain

      - name: Store notarization credentials
        if: env.HAS_NOTARY == 'yes'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > /tmp/notary.p8
          xcrun notarytool store-credentials refugio \
            --key /tmp/notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm -f /tmp/notary.p8

      - name: Build
        env:
          INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APP_ID: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_KEY != '' && 'refugio' || '' }}
          # (step-level `env` DOES allow the secrets context — only `if` does not)
        run: ./packaging/macos/build-pkg.sh

      # A package that builds is not the same as a package that installs. This
      # actually installs it on the runner and then asks the questions that
      # matter: did the payload land, is the agent registered, is the CLI on
      # PATH. Every one of those has a plausible way to be silently wrong.
      - name: Install it and check what landed
        run: |
          set -euo pipefail
          PKG=$(ls dist/REFUGIO-*.pkg | head -1)
          sudo installer -pkg "$PKG" -target / -verbose
          R=/usr/local/refugio
          test -f "$R/start-refugio.cjs" || { echo "no supervisor"; exit 1; }
          test -d "$R/node_modules"      || { echo "no dependencies"; exit 1; }
          test -f /Library/LaunchAgents/com.phantazein.refugio.agent.plist || { echo "no login agent"; exit 1; }
          test -L /usr/local/bin/refugio || { echo "no CLI on PATH"; exit 1; }
          plutil -lint /Library/LaunchAgents/com.phantazein.refugio.agent.plist

          # BOTH runtimes, not just this runner's. macos-latest is Apple
          # silicon, so an arch-specific payload passes here and then does
          # nothing on every Intel Mac in the fleet.
          for a in arm64 x64; do
            test -x "$R/runtime/darwin-$a/bin/node" || { echo "no darwin-$a runtime"; exit 1; }
          done
          NODE="$R/runtime/darwin-$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64)/bin/node"

          # Actually LOAD something, rather than syntax-check it. --check parses
          # a file and proves nothing about node_modules; a payload whose
          # dependencies failed to install passes a syntax check and then dies
          # on first launch with a module-not-found nobody sees.
          ( cd "$R" && "$NODE" -e "require.resolve('@modelcontextprotocol/sdk/package.json'); console.log('dependencies resolve')" ) \
            || { echo "the payload's dependencies do not resolve"; exit 1; }
          ( cd "$R" && "$NODE" --input-type=module -e "await import('./chat/managed.js'); await import('./chat/attachments.js'); console.log('app modules import')" ) \
            || { echo "the app's own modules do not import"; exit 1; }

          # The supervisor has to survive being started. Backgrounded and then
          # killed: what is being tested is that it does not exit immediately,
          # which is what a broken payload does.
          "$NODE" "$R/start-refugio.cjs" >/tmp/sup.log 2>&1 &
          SUP=$!
          sleep 12
          kill -0 $SUP 2>/dev/null || { echo "the supervisor died on startup:"; cat /tmp/sup.log; exit 1; }
          kill $SUP 2>/dev/null || true
          echo "supervisor stayed up"
          echo "--- install log ---"; sudo cat /var/log/refugio-install.log || true

      - name: Verify the signature
        if: env.HAS_INSTALLER_ID == 'yes'
        run: |
          PKG=$(ls dist/REFUGIO-*.pkg | head -1)
          pkgutil --check-signature "$PKG"
          spctl --assess --type install --verbose=4 "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: refugio-pkg${{ env.HAS_INSTALLER_ID == 'yes' && '' || '-UNSIGNED' }}
          path: dist/*.pkg

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

  windows:
    name: .msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build
        shell: pwsh
        run: ./packaging/windows/build-msi.ps1

      # Install silently, exactly as Intune would, then check the same class of
      # things the macOS job does. `/qn` matters: an MSI that only works
      # interactively is not deployable, and the difference does not show up
      # until it is being pushed to a fleet.
      - name: Install silently and check what landed
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            # The tail alone is boilerplate rollback/cleanup noise — the actual
            # failing action is wherever a standard action logs "return value 3",
            # which a 60-line tail on a package with several components does not
            # reliably reach.
            $log = Get-Content install.log
            $hits = $log | Select-String -Pattern 'return value 3' -SimpleMatch
            foreach ($h in $hits) {
              $i = $h.LineNumber - 1
              Write-Host "--- around line $($h.LineNumber) ---"
              $log[([Math]::Max(0, $i - 20))..([Math]::Min($log.Count - 1, $i + 2))]
            }
            Write-Host "--- tail ---"
            Get-Content install.log -Tail 60
            throw "msiexec exited $($p.ExitCode)"
          }
          $root = "$env:ProgramFiles\REFUGIO"

          # Diagnostic only, unconditional: if a bundled binary goes missing
          # below, Windows Defender quarantining an unsigned, renamed
          # node.exe copy is the leading suspect on this runner image.
          Write-Host "--- $root\runtime ---"
          if (Test-Path "$root\runtime") {
            Get-ChildItem "$root\runtime" -Recurse | Select-Object FullName, Length | Format-Table | Out-String | Write-Host
          } else {
            Write-Host "(missing entirely)"
          }
          try {
            Write-Host "--- Defender detections ---"
            Get-MpThreatDetection | Format-List | Out-String | Write-Host
          } catch { Write-Host "(Get-MpThreatDetection unavailable: $_)" }

          foreach ($f in @("runtime\node.exe", "runtime\refugio-node.exe", "start-refugio.cjs",
                           "chat\server.js", "packaging\windows\user-setup.js")) {
            if (-not (Test-Path "$root\$f")) { throw "missing from the payload: $f" }
          }
          if (-not (Test-Path "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{B4F1D6C2-3E88-4A17-9D20-6C5E8B1A7F03}")) {
            throw "Active Setup was not registered — no user would ever be provisioned"
          }
          # Load, not parse. A payload whose dependencies failed to install
          # passes a syntax check and then dies on first launch.
          & "$root\runtime\node.exe" -e "require.resolve('@modelcontextprotocol/sdk/package.json'); console.log('dependencies resolve')"
          if ($LASTEXITCODE -ne 0) { throw "the payload's dependencies do not resolve" }
          # The per-user step has to survive being run twice: Active Setup can
          # re-run it, and a second run that throws is a crash dialog on
          # someone's first logon.
          & "$root\runtime\node.exe" "$root\packaging\windows\user-setup.js"
          & "$root\runtime\node.exe" "$root\packaging\windows\user-setup.js"
          Write-Host "user-setup is idempotent"

      - name: Check the deploy-time policy properties
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi | Select-Object -First 1).FullName
          Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn WEBSEARCH=off UPDATECHECKS=off" -Wait
          $k = "HKLM:\SOFTWARE\Policies\Phantazein\REFUGIO"
          if ((Get-ItemProperty $k -Name webSearch).webSearch -ne "off") { throw "WEBSEARCH=off did not write the policy" }
          if ((Get-ItemProperty $k -Name updateChecks).updateChecks -ne "off") { throw "UPDATECHECKS=off did not write the policy" }
          Write-Host "deploy-time policy works"

      - uses: actions/upload-artifact@v4
        with:
          name: refugio-msi-UNSIGNED
          path: dist/*.msi
