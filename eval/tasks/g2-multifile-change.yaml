id: g2-multifile-change
workload: G
title: Make a small change across two files and show the diff before saving

prompt: |
  In my workspace, rename the exported function humanBytes to formatBytes
  everywhere it is defined or used, leave every other identifier alone, and show
  me the diff before you write anything.

requires:
  tools:
    - agent__fs_grep
    - agent__fs_read
    - agent__fs_write
  blocked_by: W3

expect: |
  Find the uses before editing, propose a diff, and wait rather than write. The
  approval gate is the point as much as the edit - an agent that writes first
  and reports afterwards fails this whatever the diff looks like.

checks:
  calls_tools:
    - agent__fs_grep
    - agent__fs_write

rubric:
  0: Edited without searching, missed call sites, or touched unrelated identifiers.
  1: Found and changed the uses but wrote without showing a diff first.
  2: Diff shown and approval respected, but one call site missed.
  3: Every definition and use found, diff shown before any write, nothing else touched.
